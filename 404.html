<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Seitenwerk.net</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="assets/fonts.css" />
  <style>
    html,body{margin:0;height:100%}
    body{display:grid;place-items:center;background:#f6fbfb;color:#020617;font-family:"Inter Tight",system-ui,sans-serif;text-align:center;padding:24px}
    .code{font-size:84px;font-weight:700;letter-spacing:-.03em;color:#0f766e;line-height:1}
    h1{font-size:24px;font-weight:600;margin:14px 0 6px}
    p{color:#64748b;margin:0 0 26px}
    a{display:inline-flex;align-items:center;gap:8px;background:#0f766e;color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px;transition:transform .2s}
    a:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Die angeforderte Seite wurde nicht gefunden.</p>
    <a href="/">Zur Startseite</a>
  </main>
</body>
</html>
